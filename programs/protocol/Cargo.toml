[package]
name = "protocol"
version = "0.1.0"
description = "Cipher Quants protocol — Pinocchio port of the hybrid PropAMM-RFQ settlement program"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "protocol"

[features]
default = []
# Lets a downstream crate depend on us for types without pulling the
# Pinocchio program entrypoint (would conflict with their own).
no-entrypoint = []
# Test-only feature: builds the on-chain test helpers used by the
# integration suite (parity with the prior Anchor `test-feature` flag).
# Currently only flips `SAFETY_BUFFER_SLOTS` from 150 to 5 so the
# `close_expired_nonce` happy-path test doesn't sit for a full minute.
test-feature = []

[dependencies]
pinocchio = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio-token = { workspace = true }
pinocchio-log = { workspace = true }
solana-address = { workspace = true }
borsh = { workspace = true }
shank = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
